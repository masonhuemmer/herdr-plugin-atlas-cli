id = "herdr-ticket"
name = "Herdr Ticket"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Bind Herdr tabs to Jira tickets"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "bin/herdr-ticket", "startup"]

[[actions]]
id = "new-ticket-tab"
title = "New ticket tab"
command = ["sh", "bin/herdr-ticket", "open-picker"]

[[actions]]
id = "reconcile"
title = "Reconcile ticket rows"
command = ["sh", "bin/herdr-ticket", "reconcile"]

[[panes]]
id = "picker"
title = "Ticket picker"
placement = "overlay"
command = ["sh", "bin/herdr-ticket", "picker"]

[[events]]
on = "pane.created"
command = ["sh", "bin/herdr-ticket", "reconcile"]

[[events]]
on = "tab.renamed"
command = ["sh", "bin/herdr-ticket", "reconcile"]
